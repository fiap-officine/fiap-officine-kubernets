name: Terraform CI/CD - Kubernetes & Network

on:
  push:
    branches: [main, develop]
    paths: ["terraform/**", ".github/workflows/terraform.yml"]
  pull_request:
    branches: [main, develop]
    paths: ["terraform/**", ".github/workflows/terraform.yml"]
  # Reaplicar sob demanda (ex.: ligar a Lambda ao API Gateway após o deploy dela)
  workflow_dispatch:

permissions:
  contents: read

# Sem lock no S3 (Terraform 1.9): uma execução por vez
concurrency:
  group: terraform-${{ github.repository }}
  cancel-in-progress: false

env:
  AWS_REGION: sa-east-1
  TF_STATE_KEY: platform/homolog/terraform.tfstate

jobs:
  validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      - name: Terraform Format Check
        run: terraform fmt -check -recursive terraform/

      - name: Init and Validate Homolog
        run: |
          cd terraform/environments/homolog
          terraform init -backend=false
          terraform validate

      - name: Init and Validate Production
        run: |
          cd terraform/environments/production
          terraform init -backend=false
          terraform validate

  plan:
    name: Terraform Plan
    needs: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/environments/homolog
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Bucket do state remoto (cria se não existir)
        id: state
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="fiap-officine-tfstate-${ACCOUNT_ID}"
          if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            # Outro repositório pode estar criando ao mesmo tempo: tolera a corrida
            aws s3api create-bucket --bucket "$BUCKET" --region "$AWS_REGION" \
              --create-bucket-configuration LocationConstraint="$AWS_REGION" \
              || aws s3api head-bucket --bucket "$BUCKET"
            aws s3api put-bucket-versioning --bucket "$BUCKET" \
              --versioning-configuration Status=Enabled
            aws s3api put-public-access-block --bucket "$BUCKET" \
              --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
          fi
          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"

      # Ambiente único: homolog (projeto acadêmico) — develop e main aplicam aqui
      - name: Terraform Plan (Homolog)
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ steps.state.outputs.bucket }}" \
            -backend-config="key=$TF_STATE_KEY" \
            -backend-config="region=$AWS_REGION"
          terraform plan -input=false -no-color

  apply:
    name: Terraform Apply
    needs: plan
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'))
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/environments/homolog
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Apply (Homolog)
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          terraform init -input=false \
            -backend-config="bucket=fiap-officine-tfstate-${ACCOUNT_ID}" \
            -backend-config="key=$TF_STATE_KEY" \
            -backend-config="region=$AWS_REGION"
          terraform apply -input=false -auto-approve
          terraform output
